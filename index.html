<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG3 Epic Adventure Roller</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-color: #1a1a1e;
            --accent-color: #da1f3d;
            --text-color: #f5f5f7;
            --text-muted: #a0a0a5;
            --gold: #c3a34a;
            --font-header: 'Cinzel', serif;
            --font-body: 'Cormorant Garamond', serif;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
            font-size: 1.3rem;
            scroll-behavior: smooth;
        }

        .container { max-width: 900px; width: 100%; text-align: center; position: relative; }
        
        .global-reset {
            position: absolute; top: 0; right: 0;
            background: rgba(255,255,255,0.05); border: 1px solid var(--gold); color: var(--gold);
            border-radius: 4px; width: 50px; height: 50px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; transition: 0.3s; z-index: 1000;
        }
        .global-reset:hover { background: var(--accent-color); color: white; border-color: white; transform: rotate(-180deg); }

        h1 { font-family: var(--font-header); margin-bottom: 5px; color: var(--gold); letter-spacing: 5px; font-size: 2.8rem; text-shadow: 0 4px 8px rgba(0,0,0,0.7); }
        .subtitle { font-family: var(--font-header); color: var(--text-muted); font-size: 1rem; margin-bottom: 25px; letter-spacing: 3px; }

        .mod-pack-container { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        .mod-pack-btn { 
            background: #25252a; border: 1px solid var(--gold); color: var(--gold); 
            padding: 14px 22px; font-family: var(--font-header); font-size: 0.8rem; 
            cursor: pointer; border-radius: 4px; transition: 0.3s;
        }
        .mod-pack-btn:hover { background: var(--gold); color: black; }

        .step-selector {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px;
            background: #25252a; padding: 18px; border-radius: 4px; border: 1px solid var(--gold); margin-bottom: 25px;
        }
        .step-toggle { font-family: var(--font-header); font-size: 1rem; display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--gold); justify-content: center; }
        .step-toggle input { transform: scale(1.3); accent-color: var(--gold); }

        .wheel-wrapper {
            position: relative; width: 420px; height: 420px;
            margin: 35px auto; border: 8px solid var(--gold);
            border-radius: 50%; box-shadow: 0 0 60px rgba(0,0,0,0.9); background: #1a1a1e;
        }

        .pointer {
            position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 22px solid transparent; border-right: 22px solid transparent; border-top: 45px solid var(--gold); z-index: 100;
        }

        canvas { width: 100%; height: 100%; border-radius: 50%; transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1); }

        .card { background-color: var(--card-color); border: 1px solid #3e3e42; border-radius: 4px; padding: 25px; margin-bottom: 20px; text-align: left; }
        .card h3 { font-family: var(--font-header); margin-top: 0; font-size: 1.1rem; color: var(--gold); border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
        .card.disabled { opacity: 0.2; pointer-events: none; filter: grayscale(1); }

        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        .checkbox-label { font-size: 1.1rem; background: #2a2a2f; padding: 12px; border-radius: 4px; border: 1px solid #333; cursor: pointer; display: flex; align-items: center; transition: 0.2s; }
        .checkbox-label i { width: 30px; text-align: center; margin-right: 10px; color: var(--gold); font-size: 1.2rem; }
        .checkbox-label:hover { border-color: var(--gold); background: #323238; }
        .checkbox-label input { transform: scale(1.4); margin-right: 12px; accent-color: var(--accent-color); }

        .btn { font-family: var(--font-header); background: linear-gradient(to bottom, #da1f3d, #8b1426); color: white; border: 1px solid var(--gold); padding: 22px; width: 100%; font-size: 1.7rem; cursor: pointer; letter-spacing: 4px; margin-top: 20px; border-radius: 4px; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        #result-banner { font-family: var(--font-header); font-size: 1.8rem; color: var(--gold); margin: 30px 0; min-height: 5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .result-icons { display: flex; gap: 20px; font-size: 2.5rem; margin-bottom: 10px; }
        .result-text { max-width: 80%; }

        .add-custom { display: flex; gap: 12px; width: 100%; margin-top: 20px; }
        .add-custom input { flex-grow: 1; background: #0a0a0c; border: 1px solid #444; color: white; padding: 12px; font-family: var(--font-body); font-size: 1.1rem; }
        .add-custom button { background: var(--gold); border: none; color: black; font-weight: bold; padding: 0 30px; cursor: pointer; font-family: var(--font-header); }
        
        #history-list { list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto; text-align: left; }
        #history-list li { padding: 15px; border-bottom: 1px solid #333; color: #ccc; font-size: 1.1rem; display: flex; flex-direction: column; }
        #history-list li span { color: var(--gold); font-family: var(--font-header); font-size: 0.9rem; margin-bottom: 5px; }
        .hidden { display: none !important; }

        .clear-btn { background: none; border: 1px solid #da1f3d; color: #da1f3d; font-size: 0.7rem; padding: 4px 8px; cursor: pointer; font-family: var(--font-header); border-radius: 3px; }
        .clear-btn:hover { background: #da1f3d; color: white; }

        /* Character Snapshot Card Styling */
.snapshot-card {
    background: url('https://i.imgur.com/k8X60nU.png') center/cover; /* Aged parchment texture */
    border: 2px solid #5a4b3f; /* Dark leather-like border */
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    margin: 30px auto;
    padding: 20px;
    width: 100%;
    max-width: 600px;
    text-align: center;
    color: #f5f5f7;
    position: relative;
}

.card-header h3 {
    font-family: var(--font-header);
    color: #d1b17d; /* Gold-embossed look */
    letter-spacing: 3px;
    font-size: 1.2rem;
    margin-bottom: 5px;
}

.header-divider {
    display: inline-block;
    width: 20px;
    height: 2px;
    background-color: #5a4b3f;
    margin: 0 10px;
}

.card-header h4 {
    font-family: var(--font-body);
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-top: 0;
}

.card-seals {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 25px 0;
}

.fate-seal {
    width: 80px;
    height: 80px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.4));
}

.copy-box {
    margin-top: 20px;
    text-align: right;
}

.copy-btn {
    background: none;
    border: 1px solid #d1b17d;
    color: #d1b17d;
    font-family: var(--font-header);
    font-size: 0.7rem;
    padding: 8px 15px;
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.2s, background-color 0.2s;
}

.copy-btn:hover {
    background-color: #d1b17d;
    color: #0f0f12;
}

.copy-btn i { margin-left: 8px; }
        
    </style>
</head>
<body>

<div class="container">
    <audio id="victory-sound" src="https://www.myinstants.com/media/sounds/level-up-rpg.mp3" preload="auto"></audio>

    <button class="global-reset" onclick="clearAllStorage()" title="Full Reset Page & Storage">⟳</button>
    
    <h1>ADVENTURE ROLLER</h1>
    <div class="subtitle">Fate of the Modded Realms</div>

    <div class="mod-pack-container">
        <button class="mod-pack-btn" onclick="injectModPack('races')">+ LOAD MODDED RACES</button>
        <button class="mod-pack-btn" onclick="injectModPack('classes')">+ LOAD MODDED CLASSES</button>
    </div>
    
    <div class="card">
        <h3>Campaign Settings</h3>
        <div class="step-selector">
            <label class="step-toggle"><input type="checkbox" id="spinGender" checked onchange="syncUI()"> Gender</label>
            <label class="step-toggle"><input type="checkbox" id="spinRace" checked onchange="syncUI()"> Race</label>
            <label class="step-toggle"><input type="checkbox" id="spinClass" checked onchange="syncUI()"> Class</label>
            <label class="step-toggle"><input type="checkbox" id="spinBG" checked onchange="syncUI()"> Background</label>
        </div>
    </div>

    <div class="card" id="cardGender">
        <h3>I. Identity Filters</h3>
        <div id="genderCheckboxes" class="checkbox-grid"></div>
    </div>

    <div class="card" id="cardRace">
        <h3>II. Race Filters</h3>
        <div id="raceCheckboxes" class="checkbox-grid"></div>
        <div class="add-custom">
            <input type="text" id="addRaceInput" placeholder="Add custom race...">
            <button onclick="addCustomOption('raceCheckboxes', 'addRaceInput', raceData)">+</button>
        </div>
    </div>

    <div class="card" id="cardClass">
        <h3>III. Class Filters</h3>
        <div id="classCheckboxes" class="checkbox-grid"></div>
        <div class="add-custom">
            <input type="text" id="addClassInput" placeholder="Add custom class...">
            <button onclick="addCustomOption('classCheckboxes', 'addClassInput', classData)">+</button>
        </div>
    </div>

    <div class="card" id="cardBG">
        <h3>IV. Background Filters</h3>
        <div id="bgCheckboxes" class="checkbox-grid"></div>
        <div class="add-custom">
            <input type="text" id="addBGInput" placeholder="Add custom background...">
            <button onclick="addCustomOption('bgCheckboxes', 'addBGInput', backgrounds)">+</button>
        </div>
    </div>

    <div class="wheel-wrapper" id="wheelSection">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
    </div>

    <div id="result-banner">Fate awaits...</div>

    <div id="snapshot-card" class="snapshot-card hidden">
      <div class="card-header">
        <h3>BDG 3 <span class="header-divider"></span> EPIC ADVENTURE ROLL</h3>
        <h4>Fate’s Decree</h4>
      </div>
      <div class="card-seals">
        <div id="gender-seal" class="fate-seal"></div>
        <div id="race-seal" class="fate-seal"></div>
        <div id="class-seal" class="fate-seal"></div>
        <div id="background-seal" class="fate-seal"></div>
      </div>
      <div class="copy-box">
        <button class="copy-btn" id="copyBtn">
            COPY TO CLIPBOARD <i class="fa-regular fa-clipboard"></i>
        </button>
      </div>
    </div>
    
    <button class="btn" id="mainBtn">BEGIN JOURNEY</button>
    <button class="btn hidden" style="background:#222; border:1px solid #444; color:var(--gold);" id="resetBtn">NEW CHARACTER</button>

    <div class="card" style="margin-top: 30px;">
        <h3>Chronicles of Fate <button class="clear-btn" onclick="clearHistory()">CLEAR HISTORY</button></h3>
        <ul id="history-list"><li id="history-placeholder" style="color: var(--text-muted); font-style: italic;">The ink has not yet dried...</li></ul>
    </div>
</div>

<script>
    // Constants & Mapping
    const iconMap = {
        "Male": "fa-solid fa-mars", "Female": "fa-solid fa-venus", "Trans-Male": "fa-solid fa-mars-double", 
        "Trans-Female": "fa-solid fa-venus-double", "Non-Binary": "fa-solid fa-genderless",
        "Barbarian": "fa-solid fa-hand-fist", "Bard": "fa-solid fa-guitar", "Cleric": "fa-solid fa-ankh",
        "Druid": "fa-solid fa-leaf", "Fighter": "fa-solid fa-shield-halved", "Monk": "fa-solid fa-hands-praying",
        "Paladin": "fa-solid fa-sun", "Ranger": "fa-solid fa-paw", "Rogue": "fa-solid fa-user-ninja",
        "Sorcerer": "fa-solid fa-wand-magic-sparkles", "Warlock": "fa-solid fa-eye", "Wizard": "fa-solid fa-hat-wizard",
        "Artificer": "fa-solid fa-gears", "Blood Hunter": "fa-solid fa-droplet",
        "Elf": "fa-solid fa-clover", "Tiefling": "fa-solid fa-fire", "Drow": "fa-solid fa-moon",
        "Human": "fa-solid fa-person", "Githyanki": "fa-solid fa-worm", "Dwarf": "fa-solid fa-mountain",
        "Half-Elf": "fa-solid fa-dna", "Halfling": "fa-solid fa-wheat-awn", "Gnome": "fa-solid fa-flask",
        "Dragonborn": "fa-solid fa-dragon", "Half-Orc": "fa-solid fa-skull",
        "Acolyte": "fa-solid fa-scroll", "Charlatan": "fa-solid fa-masks-theater", "Criminal": "fa-solid fa-sack-dollar",
        "Entertainer": "fa-solid fa-music", "Folk Hero": "fa-solid fa-hammer", "Guild Artisan": "fa-solid fa-toolbox",
        "Noble": "fa-solid fa-crown", "Outlander": "fa-solid fa-map", "Sage": "fa-solid fa-book", 
        "Soldier": "fa-solid fa-medal", "Urchin": "fa-solid fa-hand-holding"
    };

    const classColors = {
        "Barbarian": "#e7623e", "Bard": "#ab6fac", "Cleric": "#91a1b2", "Druid": "#8a9a5b",
        "Fighter": "#7f513e", "Monk": "#51a5c5", "Paladin": "#b59e54", "Ranger": "#507f62",
        "Rogue": "#555752", "Sorcerer": "#992e2e", "Warlock": "#7b469b", "Wizard": "#2a50a1",
        "Artificer": "#b15f32", "Blood Hunter": "#731212"
    };

    // Defaults
    const defaultRaces = {
        "Elf": ["High Elf", "Wood Elf"], "Tiefling": ["Asmodeus", "Mephistopheles", "Zariel"],
        "Drow": ["Lolth-Sworn", "Seldarine"], "Human": ["Standard"], "Githyanki": ["Standard"],
        "Dwarf": ["Gold Dwarf", "Shield Dwarf", "Duergar"], "Half-Elf": ["High Half-Elf", "Wood Half-Elf", "Drow Half-Elf"],
        "Halfling": ["Lightfoot", "Strongheart"], "Gnome": ["Rock Gnome", "Forest Gnome", "Deep Gnome"],
        "Dragonborn": ["Black", "Blue", "Brass", "Bronze", "Copper", "Gold", "Green", "Red", "Silver", "White"], "Half-Orc": ["Standard"]
    };
    const defaultClasses = {
        "Barbarian": ["Wildheart", "Berserker", "Wild Magic", "Giant"], "Bard": ["Lore", "Valor", "Swords", "Glamour"],
        "Cleric": ["Life", "Light", "Trickery", "Knowledge", "Nature", "Tempest", "War", "Death"], "Druid": ["Moon", "Land", "Spores", "Stars"],
        "Fighter": ["Battle Master", "Champion", "Eldritch Knight", "Arcane Archer"], "Monk": ["Open Hand", "Shadow", "Elements", "Drunken Master"],
        "Paladin": ["Devotion", "Ancients", "Vengeance", "Crown", "Oathbreaker"], "Ranger": ["Hunter", "Beast Master", "Gloom Stalker", "Swarmkeeper"],
        "Rogue": ["Thief", "Arcane Trickster", "Assassin", "Swashbuckler"], "Sorcerer": ["Draconic", "Wild Magic", "Storm", "Shadow"],
        "Warlock": ["Fiend", "Great Old One", "Archfey", "Hexblade"], "Wizard": ["Abjuration", "Evocation", "Necromancy", "Conjuration", "Divination", "Enchantment", "Illusion", "Transmutation", "Bladesinging"]
    };
    const defaultBGs = ["Acolyte", "Charlatan", "Criminal", "Entertainer", "Folk Hero", "Guild Artisan", "Noble", "Outlander", "Sage", "Soldier", "Urchin"];
    const genderData = ["Male", "Female", "Trans-Male", "Trans-Female", "Non-Binary"];
    
    // State Variables
    let raceData = JSON.parse(localStorage.getItem('bg3_races')) || JSON.parse(JSON.stringify(defaultRaces));
    let classData = JSON.parse(localStorage.getItem('bg3_classes')) || JSON.parse(JSON.stringify(defaultClasses));
    let backgrounds = JSON.parse(localStorage.getItem('bg3_bgs')) || [...defaultBGs];
    let rollingHistory = JSON.parse(localStorage.getItem('bg3_history')) || [];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const mainBtn = document.getElementById('mainBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultBanner = document.getElementById('result-banner');
    const historyList = document.getElementById('history-list');
    const victorySound = document.getElementById('victory-sound');
    victorySound.volume = 0.4;
    const snapshotCard = document.getElementById('snapshot-card');
    const copyBtn = document.getElementById('copyBtn');
    let sessionResultString = ""; // This stores the text for the copy button
    
    let currentRotation = 0;
    let rollState = "START"; 
    let sessionResult = { gender: "", race: "", subrace: "", class: "", subclass: "", background: "" };

    // STORAGE LOGIC
    function saveAllToStorage() {
        localStorage.setItem('bg3_races', JSON.stringify(raceData));
        localStorage.setItem('bg3_classes', JSON.stringify(classData));
        localStorage.setItem('bg3_bgs', JSON.stringify(backgrounds));
        localStorage.setItem('bg3_history', JSON.stringify(rollingHistory));
    }

    function clearAllStorage() {
        if(confirm("This will delete all custom mod entries and your history. Are you sure?")) {
            localStorage.clear();
            location.reload();
        }
    }

    function clearHistory() {
        rollingHistory = [];
        saveAllToStorage();
        renderHistory();
    }

    // SCROLL LOGIC
    function scrollToWheel() {
        const section = document.getElementById('wheelSection');
        const offset = 100;
        const bodyRect = document.body.getBoundingClientRect().top;
        const elementRect = section.getBoundingClientRect().top;
        const elementPosition = elementRect - bodyRect;
        const offsetPosition = elementPosition - (window.innerHeight / 2) + (section.offsetHeight / 2) + offset;
        window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
    }

    // UI RENDERING
    function getIconHTML(name) { return iconMap[name] ? `<i class="${iconMap[name]}"></i>` : `<i class="fa-solid fa-sparkles"></i>`; }

    function populate(data, id) {
        const container = document.getElementById(id);
        const keys = Array.isArray(data) ? data : Object.keys(data);
        container.innerHTML = "";
        keys.forEach(k => {
            const lbl = document.createElement('label');
            lbl.className = 'checkbox-label';
            lbl.innerHTML = `<input type="checkbox" value="${k}" checked onchange="refreshWheel()"> ${getIconHTML(k)} ${k}`;
            container.appendChild(lbl);
        });
    }

    function renderHistory() {
        historyList.innerHTML = "";
        if (rollingHistory.length === 0) {
            historyList.innerHTML = `<li id="history-placeholder" style="color: var(--text-muted); font-style: italic;">The ink has not yet dried...</li>`;
            return;
        }
        rollingHistory.forEach((entry, idx) => {
            const li = document.createElement('li');
            li.innerHTML = `<span>ENTRY #${rollingHistory.length - idx}</span>${entry}`;
            historyList.appendChild(li);
        });
    }

    function syncUI() {
        document.getElementById('cardGender').classList.toggle('disabled', !document.getElementById('spinGender').checked);
        document.getElementById('cardRace').classList.toggle('disabled', !document.getElementById('spinRace').checked);
        document.getElementById('cardClass').classList.toggle('disabled', !document.getElementById('spinClass').checked);
        document.getElementById('cardBG').classList.toggle('disabled', !document.getElementById('spinBG').checked);
        refreshWheel();
    }

    function getActive(id) { return Array.from(document.querySelectorAll(`#${id} input:checked`)).map(i => i.value); }

    // WHEEL LOGIC
    function drawWheel(options) {
        const n = options.length;
        if (n === 0) { ctx.clearRect(0,0,500,500); return; }
        const arc = (Math.PI*2)/n;
        ctx.clearRect(0,0,500,500);
        options.forEach((opt, i) => {
            ctx.fillStyle = classColors[opt] || (i % 2 === 0 ? "#121216" : "#1d1d22");
            ctx.beginPath(); ctx.moveTo(250,250); ctx.arc(250,250,250, i*arc, (i+1)*arc); ctx.fill();
            ctx.strokeStyle = "#c3a34a"; ctx.lineWidth = 2; ctx.stroke();
            ctx.save(); ctx.translate(250,250); ctx.rotate(i*arc + arc/2);
            ctx.textAlign = "right"; ctx.fillStyle = classColors[opt] ? "#ffffff" : "#c3a34a";
            ctx.font = `bold ${n > 12 ? '14' : '18'}px 'Cinzel'`; 
            ctx.fillText(opt.toUpperCase(), 235, 6); ctx.restore();
        });
    }

    function spin(options, onEnd) {
        scrollToWheel();
        const roll = 1800 + Math.floor(Math.random()*360);
        currentRotation += roll;
        canvas.style.transform = `rotate(${currentRotation}deg)`;
        mainBtn.disabled = true;
        setTimeout(() => {
            const idx = Math.floor(((360 - (currentRotation%360) + 270) % 360) / (360/options.length));
            onEnd(options[idx]);
        }, 5100);
    }

    function nextStep() {
        mainBtn.disabled = false;
        if (rollState === "START") {
            if (document.getElementById('spinGender').checked) { rollState = "GENDER"; mainBtn.innerText = "SPIN FOR GENDER"; drawWheel(getActive('genderCheckboxes')); scrollToWheel(); }
            else { sessionResult.gender = ""; rollState = "RACE_PENDING"; nextStep(); }
        } else if (rollState === "RACE_PENDING") {
            if (document.getElementById('spinRace').checked) { rollState = "RACE"; mainBtn.innerText = "SPIN FOR RACE"; resetWheelPos(() => drawWheel(getActive('raceCheckboxes'))); scrollToWheel(); }
            else { sessionResult.race = ""; rollState = "CLASS_PENDING"; nextStep(); }
        } else if (rollState === "CLASS_PENDING") {
            if (document.getElementById('spinClass').checked) { rollState = "CLASS"; mainBtn.innerText = "SPIN FOR CLASS"; resetWheelPos(() => drawWheel(getActive('classCheckboxes'))); scrollToWheel(); }
            else { sessionResult.class = ""; rollState = "BG_PENDING"; nextStep(); }
        } else if (rollState === "BG_PENDING") {
            if (document.getElementById('spinBG').checked) { rollState = "BACKGROUND"; mainBtn.innerText = "SPIN FOR BACKGROUND"; resetWheelPos(() => drawWheel(getActive('bgCheckboxes'))); scrollToWheel(); }
            else { sessionResult.background = ""; finalize(); }
        }
    }

    function finalize() {
        const r = sessionResult;
        const raceFinal = r.subrace ? `${r.subrace} ${r.race}` : r.race;
        const total = `${r.gender} ${raceFinal} | ${r.class} (${r.subclass}) | ${r.background}`;
        
        victorySound.play().catch(() => {});

        resultBanner.innerHTML = `
            <div class="result-icons">
                ${r.gender ? getIconHTML(r.gender) : ''}
                ${r.race ? getIconHTML(r.race) : ''}
                ${r.class ? getIconHTML(r.class) : ''}
                ${r.background ? getIconHTML(r.background) : ''}
            </div>
            <div class="result-text">${total}</div>
        `;

        rollingHistory.unshift(total);
        saveAllToStorage();
        renderHistory();

        mainBtn.classList.add('hidden');
        resetBtn.classList.remove('hidden');
        mainBtn.disabled = false;
        scrollToWheel();

        function finalize() {
    // ... (your existing result banner and history list logic)

    // Prepare Snapshot Card data
    sessionResultString = total; // Save string for copy function

    // Populate the card's icons (this would need image files or similar)
    document.getElementById('gender-seal').style.backgroundImage = `url('path_to_gender_icon.png')`; // Replace with actual paths
    document.getElementById('race-seal').style.backgroundImage = `url('path_to_race_icon.png')`; // Replace with actual paths
    document.getElementById('class-seal').style.backgroundImage = `url('path_to_class_icon.png')`; // Replace with actual paths
    document.getElementById('background-seal').style.backgroundImage = `url('path_to_background_icon.png')`; // Replace with actual paths

    snapshotCard.classList.remove('hidden'); // Reveal the card
    copyBtn.innerHTML = 'COPY TO CLIPBOARD <i class="fa-regular fa-clipboard"></i>'; // Reset button text

    mainBtn.classList.add('hidden');
    resetBtn.classList.remove('hidden');
    mainBtn.disabled = false;
    scrollToWheel();
}
    }

    function resetWheelPos(cb) {
        canvas.style.transition = 'none'; canvas.style.transform = 'rotate(0deg)'; currentRotation = 0;
        setTimeout(() => { canvas.style.transition = 'transform 5s cubic-bezier(0.1, 0, 0.1, 1)'; if(cb) cb(); }, 50);
    }

    function softReset() {
        rollState = "START";
        sessionResult = { gender: "", race: "", subrace: "", class: "", subclass: "", background: "" };
        resultBanner.innerText = "Fate awaits...";
        mainBtn.innerText = "BEGIN JOURNEY";
        mainBtn.classList.remove('hidden');
        resetBtn.classList.add('hidden');
        resetWheelPos(() => { refreshWheel(); scrollToWheel(); });
    }

    function refreshWheel() {
        if (rollState === "GENDER" || rollState === "START") drawWheel(getActive('genderCheckboxes'));
        else if (rollState === "RACE") drawWheel(getActive('raceCheckboxes'));
        else if (rollState === "CLASS") drawWheel(getActive('classCheckboxes'));
        else if (rollState === "BACKGROUND") drawWheel(getActive('bgCheckboxes'));
    }

    mainBtn.onclick = () => {
        if(victorySound.paused) { victorySound.play().then(() => { victorySound.pause(); victorySound.currentTime = 0; }).catch(()=>{}); }
        if (rollState === "START") nextStep();
        else if (rollState === "GENDER") { 
            spin(getActive('genderCheckboxes'), (win) => { sessionResult.gender = win; resultBanner.innerHTML = `${getIconHTML(win)} <b>${win}</b>`; rollState = "RACE_PENDING"; nextStep(); }); 
        }
        else if (rollState === "RACE") {
            spin(getActive('raceCheckboxes'), (win) => {
                sessionResult.race = win; 
                resultBanner.innerHTML = `${getIconHTML(win)} <b>${win}</b>`;
                const subs = raceData[win];
                if (subs && (subs.length > 1 || subs[0] !== "Standard")) {
                    rollState = "SUBRACE"; mainBtn.innerText = "SPIN SUB-RACE"; mainBtn.disabled = false; resetWheelPos(() => drawWheel(subs)); scrollToWheel();
                } else { rollState = "CLASS_PENDING"; nextStep(); }
            });
        }
        else if (rollState === "SUBRACE") { spin(raceData[sessionResult.race], (win) => { sessionResult.subrace = win; resultBanner.innerHTML = `${getIconHTML(sessionResult.race)} <b>${win} ${sessionResult.race}</b>`; rollState = "CLASS_PENDING"; nextStep(); }); }
        else if (rollState === "CLASS") {
            spin(getActive('classCheckboxes'), (win) => {
                sessionResult.class = win; 
                resultBanner.innerHTML = `${getIconHTML(win)} <b>${win}</b>`;
                rollState = "SUBCLASS"; mainBtn.innerText = "SPIN SUB-CLASS"; mainBtn.disabled = false; resetWheelPos(() => drawWheel(classData[win])); scrollToWheel();
            });
        }
        else if (rollState === "SUBCLASS") { spin(classData[sessionResult.class], (win) => { sessionResult.subclass = win; resultBanner.innerHTML = `${getIconHTML(sessionResult.class)} <b>${sessionResult.class} (${win})</b>`; rollState = "BG_PENDING"; nextStep(); }); }
        else if (rollState === "BACKGROUND") { spin(getActive('bgCheckboxes'), (win) => { sessionResult.background = win; finalize(); }); }
    };

    resetBtn.onclick = softReset;
    
    // This makes the Copy button actually work
    copyBtn.onclick = () => {
        if (sessionResultString) {
            navigator.clipboard.writeText(sessionResultString).then(() => {
                copyBtn.innerHTML = 'COPIED! <i class="fa-solid fa-check"></i>';
                setTimeout(() => {
                    copyBtn.innerHTML = 'COPY TO CLIPBOARD <i class="fa-regular fa-clipboard"></i>';
                }, 2000);
            });
        }
    };

    function injectModPack(type) {
        if (type === 'races') { 
            ["Aasimar", "Demon", "Fairy", "Firbolg", "Tabaxi", "Goliath", "Warforged", "Satyr"].forEach(m => { if(!raceData[m]) raceData[m] = ["Standard"]; }); 
            populate(raceData, 'raceCheckboxes'); 
        } else { 
            Object.assign(classData, { "Artificer": ["Alchemist", "Armorer", "Artillerist", "Battlesmith"], "Blood Hunter": ["Ghostslayer", "Lycan", "Mutant", "Profane Soul"] }); 
            populate(classData, 'classCheckboxes'); 
        }
        saveAllToStorage();
        refreshWheel();
    }
    
    function addCustomOption(containerId, inputId, dataSource) {
        const input = document.getElementById(inputId); const val = input.value.trim(); if (!val) return;
        if (Array.isArray(dataSource)) { if (!dataSource.includes(val)) dataSource.push(val); } else { if (!dataSource[val]) dataSource[val] = ["Standard"]; }
        populate(dataSource, containerId); input.value = ""; 
        saveAllToStorage();
        refreshWheel();
    }

    window.onload = () => { 
        populate(genderData, 'genderCheckboxes'); 
        populate(raceData, 'raceCheckboxes'); 
        populate(classData, 'classCheckboxes'); 
        populate(backgrounds, 'bgCheckboxes'); 
        renderHistory();
        refreshWheel(); 
    };
</script>
