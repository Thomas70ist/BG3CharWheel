<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG3 Character Spinner</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-color: #1a1a1e;
            --accent-color: #da1f3d;
            --text-color: #f5f5f7;
            --text-muted: #a0a0a5;
            --gold: #c3a34a;
        }

        body {
            /* Restoring the modern Sans-Serif font */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { max-width: 600px; width: 100%; text-align: center; }
        
        h1 { margin-bottom: 5px; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }

        .wheel-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px auto;
            border: 6px solid var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 25px solid var(--gold);
            z-index: 10;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .card {
            background-color: var(--card-color);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .card h3 { margin-top: 0; font-size: 0.9rem; color: var(--gold); text-transform: uppercase; }

        .controls { margin-bottom: 15px; }
        .toggle-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: underline;
            padding: 0;
            margin-right: 10px;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
        }

        .checkbox-label {
            font-size: 0.8rem;
            background: #25252a;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .checkbox-label input { margin-right: 6px; accent-color: var(--accent-color); }

        .btn {
            background: linear-gradient(to bottom, #da1f3d, #8b1426);
            color: white;
            border: 1px solid var(--gold);
            padding: 15px;
            width: 100%;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            border-radius: 6px;
        }

        .btn:disabled { opacity: 0.5; }

        #result-banner {
            font-size: 1.5rem;
            color: var(--gold);
            margin: 15px 0;
            font-weight: bold;
            height: 1.8rem;
        }

        /* Roll History Styling */
        #history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
        }
        #history-list li {
            padding: 8px 0;
            border-bottom: 1px solid #333;
            font-size: 0.9rem;
        }
        #history-list li span { color: var(--gold); font-weight: bold; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>BG3 Spinner</h1>
    <div class="subtitle">Character Class & Subclass Roller</div>
    
    <div class="card">
        <h3>1. Available Classes</h3>
        <div class="controls">
            <button class="toggle-btn" id="allOn">Select All</button>
            <button class="toggle-btn" id="allOff">Clear All</button>
        </div>
        <div class="checkbox-grid" id="checkboxContainer"></div>
    </div>

    <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
    </div>

    <div id="result-banner">Ready to Roll</div>
    
    <button class="btn" id="spinBtn">SPIN FOR CLASS</button>
    <button class="btn hidden" id="subclassBtn">SPIN FOR SUBCLASS</button>

    <div class="card" style="margin-top: 20px;">
        <h3>Roll History</h3>
        <ul id="history-list">
            <li style="color: var(--text-muted);">No rolls yet...</li>
        </ul>
    </div>
</div>

<script>
    const bg3Data = {
        "Barbarian": ["Wildheart", "Berserker", "Wild Magic"],
        "Bard": ["Lore", "Valor", "Swords"],
        "Cleric": ["Life", "Light", "Trickery", "Knowledge", "Nature", "Tempest", "War"],
        "Druid": ["Moon", "Land", "Spores"],
        "Fighter": ["Battle Master", "Champion", "Eldritch Knight"],
        "Monk": ["Open Hand", "Shadow", "Elements"],
        "Paladin": ["Devotion", "Ancients", "Vengeance", "Oathbreaker"],
        "Ranger": ["Hunter", "Beast Master", "Gloom Stalker"],
        "Rogue": ["Thief", "Arcane Trickster", "Assassin"],
        "Sorcerer": ["Draconic", "Wild Magic", "Storm"],
        "Warlock": ["Fiend", "Great Old One", "Archfey"],
        "Wizard": ["Abjuration", "Evocation", "Necromancy", "Conjuration", "Divination", "Enchantment", "Illusion", "Transmutation"]
    };

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const subclassBtn = document.getElementById('subclassBtn');
    const resultBanner = document.getElementById('result-banner');
    const historyList = document.getElementById('history-list');
    
    let currentOptions = [];
    let currentRotation = 0;
    let lastWinner = "";

    // 1. Initialize Checkboxes
    const container = document.getElementById('checkboxContainer');
    Object.keys(bg3Data).forEach(cls => {
        const lbl = document.createElement('label');
        lbl.className = 'checkbox-label';
        lbl.innerHTML = `<input type="checkbox" value="${cls}" checked> ${cls}`;
        container.appendChild(lbl);
    });

    // 2. Select All/None
    document.getElementById('allOn').onclick = () => toggleBoxes(true);
    document.getElementById('allOff').onclick = () => toggleBoxes(false);
    
    function toggleBoxes(state) {
        document.querySelectorAll('#checkboxContainer input').forEach(i => i.checked = state);
        updateWheelPool();
    }

    container.onchange = updateWheelPool;

    function updateWheelPool() {
        const checked = Array.from(document.querySelectorAll('#checkboxContainer input:checked')).map(i => i.value);
        currentOptions = checked;
        drawWheel(checked);
    }

    // 3. Draw the Wheel (Styled for Modern Font)
    function drawWheel(options) {
        const numSlices = options.length;
        if (numSlices === 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            return;
        }
        const arc = (Math.PI * 2) / numSlices;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        options.forEach((opt, i) => {
            const angle = i * arc;
            ctx.fillStyle = i % 2 === 0 ? "#1a1a1e" : "#2a2a30";
            ctx.beginPath();
            ctx.moveTo(250, 250);
            ctx.arc(250, 250, 250, angle, angle + arc);
            ctx.fill();
            ctx.strokeStyle = "#c3a34a";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.save();
            ctx.translate(250, 250);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#f5f5f7";
            ctx.font = "bold 16px sans-serif"; // Modern font applied here
            ctx.fillText(opt, 230, 8);
            ctx.restore();
        });
    }

    // 4. Spin Logic
    function spin(options, onEnd) {
        if (options.length === 0) return;
        const spinRoll = Math.floor(Math.random() * 360) + 1800; 
        currentRotation += spinRoll;
        canvas.style.transform = `rotate(-${currentRotation}deg)`;

        spinBtn.disabled = true;
        subclassBtn.disabled = true;

        setTimeout(() => {
            const actualDeg = currentRotation % 360;
            const arcDeg = 360 / options.length;
            const winningIndex = Math.floor(actualDeg / arcDeg);
            onEnd(options[winningIndex]);
        }, 4000);
    }

    function addToHistory(text) {
        if (historyList.innerHTML.includes("No rolls yet")) historyList.innerHTML = "";
        const li = document.createElement('li');
        li.innerHTML = `Rolled: <span>${text}</span>`;
        historyList.prepend(li);
    }

    spinBtn.onclick = () => {
        if (currentOptions.length === 0) return alert("Select at least one class!");
        resultBanner.innerText = "Rolling Class...";
        spin(currentOptions, (winner) => {
            lastWinner = winner;
            resultBanner.innerText = winner.toUpperCase();
            spinBtn.classList.add('hidden');
            subclassBtn.classList.remove('hidden');
            subclassBtn.disabled = false;
            setTimeout(() => drawWheel(bg3Data[winner]), 100);
        });
    };

    subclassBtn.onclick = () => {
        resultBanner.innerText = "Rolling Subclass...";
        spin(bg3Data[lastWinner], (sub) => {
            const fullResult = `${lastWinner} (${sub})`;
            resultBanner.innerText = fullResult;
            addToHistory(fullResult);
            subclassBtn.classList.add('hidden');
            spinBtn.classList.remove('hidden');
            spinBtn.disabled = false;
            setTimeout(updateWheelPool, 2000);
        });
    };

    updateWheelPool();
</script>
</body>
</html>
