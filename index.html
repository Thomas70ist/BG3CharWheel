<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG3 Character Spinner</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-color: #1a1a1e;
            --accent-color: #da1f3d;
            --text-color: #f5f5f7;
            --gold: #c3a34a;
        }

        body {
            font-family: 'serif', 'Palatino', 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { max-width: 800px; width: 100%; text-align: center; }
        
        .wheel-wrapper {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 30px auto;
            border: 8px solid var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 15px var(--gold);
        }

        /* The Triangle Pointer */
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--gold);
            z-index: 10;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .card {
            background-color: var(--card-color);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            text-align: left;
            margin-top: 15px;
        }

        .checkbox-label {
            font-size: 0.85rem;
            background: #222;
            padding: 5px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn {
            background: linear-gradient(to bottom, #da1f3d, #8b1426);
            color: white;
            border: 1px solid var(--gold);
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            margin-top: 10px;
        }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #result-banner {
            font-size: 2rem;
            color: var(--gold);
            margin: 20px 0;
            min-height: 2.5rem;
            text-shadow: 0 0 10px rgba(195, 163, 74, 0.5);
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Baldur's Gate 3 Roll</h1>
    
    <div class="card">
        <div class="checkbox-grid" id="checkboxContainer"></div>
    </div>

    <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
    </div>

    <div id="result-banner">Select classes & spin!</div>
    
    <button class="btn" id="spinBtn">Spin for Class</button>
    <button class="btn hidden" id="subclassBtn">Spin for Subclass</button>
</div>

<script>
    const bg3Data = {
        "Barbarian": ["Wildheart", "Berserker", "Wild Magic"],
        "Bard": ["Lore", "Valor", "Swords"],
        "Cleric": ["Life", "Light", "Trickery", "Knowledge", "Nature", "Tempest", "War"],
        "Druid": ["Moon", "Land", "Spores"],
        "Fighter": ["Battle Master", "Champion", "Eldritch Knight"],
        "Monk": ["Open Hand", "Shadow", "Elements"],
        "Paladin": ["Devotion", "Ancients", "Vengeance", "Oathbreaker"],
        "Ranger": ["Hunter", "Beast Master", "Gloom Stalker"],
        "Rogue": ["Thief", "Arcane Trickster", "Assassin"],
        "Sorcerer": ["Draconic", "Wild Magic", "Storm"],
        "Warlock": ["Fiend", "Great Old One", "Archfey"],
        "Wizard": ["Abjuration", "Evocation", "Necromancy", "Conjuration", "Divination", "Enchantment", "Illusion", "Transmutation"]
    };

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const subclassBtn = document.getElementById('subclassBtn');
    const resultBanner = document.getElementById('result-banner');
    
    let currentOptions = [];
    let currentRotation = 0;
    let isRollingSubclass = false;
    let lastWinner = "";

    // 1. Initialize Checkboxes
    const container = document.getElementById('checkboxContainer');
    Object.keys(bg3Data).forEach(cls => {
        const lbl = document.createElement('label');
        lbl.className = 'checkbox-label';
        lbl.innerHTML = `<input type="checkbox" value="${cls}" checked onchange="updateWheelPool()"> ${cls}`;
        container.appendChild(lbl);
    });

    function updateWheelPool() {
        if (isRollingSubclass) return;
        const checked = Array.from(document.querySelectorAll('input:checked')).map(i => i.value);
        drawWheel(checked);
        currentOptions = checked;
    }

    // 2. Draw the Wheel
    function drawWheel(options) {
        const numSlices = options.length;
        const arc = (Math.PI * 2) / numSlices;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        options.forEach((opt, i) => {
            const angle = i * arc;
            ctx.fillStyle = i % 2 === 0 ? "#1a1a1e" : "#2a2a30";
            ctx.beginPath();
            ctx.moveTo(250, 250);
            ctx.arc(250, 250, 250, angle, angle + arc);
            ctx.fill();
            ctx.strokeStyle = "#c3a34a";
            ctx.stroke();

            // Add Text
            ctx.save();
            ctx.translate(250, 250);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#f5f5f7";
            ctx.font = "bold 18px serif";
            ctx.fillText(opt, 230, 10);
            ctx.restore();
        });
    }

    // 3. Spin Logic
    function spin(options, onEnd) {
        if (options.length === 0) return;
        
        const spinRoll = Math.floor(Math.random() * 360) + 1440; // At least 4 full spins
        currentRotation += spinRoll;
        canvas.style.transform = `rotate(-${currentRotation}deg)`;

        spinBtn.disabled = true;
        subclassBtn.disabled = true;

        setTimeout(() => {
            const actualDeg = currentRotation % 360;
            const arcDeg = 360 / options.length;
            const winningIndex = Math.floor(actualDeg / arcDeg);
            const winner = options[winningIndex];
            onEnd(winner);
        }, 4000);
    }

    spinBtn.onclick = () => {
        isRollingSubclass = false;
        resultBanner.innerText = "Rolling Class...";
        spin(currentOptions, (winner) => {
            lastWinner = winner;
            resultBanner.innerText = "CLASS: " + winner;
            spinBtn.classList.add('hidden');
            subclassBtn.classList.remove('hidden');
            subclassBtn.disabled = false;
            
            // Prepare Subclass Wheel
            setTimeout(() => drawWheel(bg3Data[winner]), 100);
        });
    };

    subclassBtn.onclick = () => {
        isRollingSubclass = true;
        resultBanner.innerText = "Rolling Subclass...";
        spin(bg3Data[lastWinner], (sub) => {
            resultBanner.innerText = `${lastWinner} (${sub})`;
            subclassBtn.classList.add('hidden');
            spinBtn.classList.remove('hidden');
            spinBtn.disabled = false;
            // Reset to main classes
            setTimeout(updateWheelPool, 2000);
        });
    };

    updateWheelPool();
</script>
</body>
</html>
