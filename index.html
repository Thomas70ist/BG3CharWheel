<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG3 Ultimate Character Spinner</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-color: #1a1a1e;
            --accent-color: #da1f3d;
            --text-color: #f5f5f7;
            --text-muted: #a0a0a5;
            --gold: #c3a34a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { max-width: 650px; width: 100%; text-align: center; }
        h1 { margin-bottom: 5px; color: var(--gold); letter-spacing: 2px; }
        .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }

        .wheel-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px auto;
            border: 6px solid var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            background: #1a1a1e;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--gold);
            z-index: 100;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
        }

        .card {
            background-color: var(--card-color);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: left;
        }

        .card h3 { margin-top: 0; font-size: 0.8rem; color: var(--gold); text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px; }

        .controls { margin-bottom: 8px; }
        .toggle-btn {
            background: none; border: none; color: var(--accent-color);
            cursor: pointer; font-size: 0.75rem; text-decoration: underline; margin-right: 10px;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 5px;
        }

        .checkbox-label {
            font-size: 0.75rem; background: #25252a; padding: 6px;
            border-radius: 4px; cursor: pointer; display: flex; align-items: center;
        }
        .checkbox-label input { margin-right: 5px; accent-color: var(--accent-color); }

        .btn {
            background: linear-gradient(to bottom, #da1f3d, #8b1426);
            color: white; border: 1px solid var(--gold); padding: 15px;
            width: 100%; font-size: 1.1rem; cursor: pointer;
            font-weight: bold; border-radius: 8px; margin-top: 10px;
        }

        .btn:disabled { opacity: 0.4; cursor: wait; }
        .reset-btn { background: #333; border: 1px solid #555; font-size: 0.9rem; padding: 10px; }

        #result-banner {
            font-size: 1.4rem; color: var(--gold); margin: 15px 0;
            font-weight: bold; min-height: 3rem; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center;
        }

        #history-list {
            list-style: none; padding: 0; margin: 0;
            max-height: 150px; overflow-y: auto; font-size: 0.85rem;
        }
        #history-list li { padding: 8px 0; border-bottom: 1px solid #333; line-height: 1.4; }
        #history-list li span { color: var(--gold); font-weight: bold; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>BG3 ADVENTURE ROLLER</h1>
    <div class="subtitle">Assemble your destiny slice by slice</div>
    
    <div class="card">
        <h3>1. Race Filters</h3>
        <div class="controls">
            <button class="toggle-btn" onclick="toggleSet('raceCheckboxes', true)">Select All</button>
            <button class="toggle-btn" onclick="toggleSet('raceCheckboxes', false)">Clear All</button>
        </div>
        <div id="raceCheckboxes" class="checkbox-grid"></div>
    </div>

    <div class="card">
        <h3>2. Class Filters</h3>
        <div class="controls">
            <button class="toggle-btn" onclick="toggleSet('classCheckboxes', true)">Select All</button>
            <button class="toggle-btn" onclick="toggleSet('classCheckboxes', false)">Clear All</button>
        </div>
        <div id="classCheckboxes" class="checkbox-grid"></div>
    </div>

    <div class="card">
        <h3>3. Background Filters</h3>
        <div class="controls">
            <button class="toggle-btn" onclick="toggleSet('bgCheckboxes', true)">Select All</button>
            <button class="toggle-btn" onclick="toggleSet('bgCheckboxes', false)">Clear All</button>
        </div>
        <div id="bgCheckboxes" class="checkbox-grid"></div>
    </div>

    <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
    </div>

    <div id="result-banner">Click to begin...</div>
    
    <button class="btn" id="mainBtn">SPIN FOR RACE</button>
    <button class="btn reset-btn hidden" id="resetBtn">START NEW CHARACTER</button>

    <div class="card" style="margin-top: 20px;">
        <h3>Roll History</h3>
        <ul id="history-list"><li style="color: var(--text-muted);">No rolls yet...</li></ul>
    </div>
</div>
